name: vyjebanaskola

# Local development via Laravel Sail (vendor/bin/sail).
# `sail up -d` serves the app on http://localhost:${APP_PORT:-8000};
# run `sail npm run dev` for Vite HMR. See docker/README.md.
#
# No env_file on the app services on purpose: Laravel reads the bind-mounted
# .env itself. Injecting .env as real container env vars would override
# phpunit.xml's <env> block (APP_ENV=testing etc.) and break the test suite.

services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8000}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy

    # Queue worker (QUEUE_CONNECTION=database) - reuses the Sail app image.
    queue:
        image: 'sail-8.4/app'
        restart: unless-stopped
        command: php artisan queue:work --tries=3 --timeout=90 --sleep=1
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_started
            pgsql:
                condition: service_healthy

    # Scheduler (runs due tasks every minute).
    scheduler:
        image: 'sail-8.4/app'
        restart: unless-stopped
        command: php artisan schedule:work
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_started
            pgsql:
                condition: service_healthy

    pgsql:
        image: 'postgres:17'
        ports:
            # host 5433 -> container 5432 (so host-side tools still work)
            - '${FORWARD_DB_PORT:-5433}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE:-vyjebanaskola}'
            POSTGRES_USER: '${DB_USERNAME:-vyjebanaskola}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE:-vyjebanaskola}'
                - '-U'
                - '${DB_USERNAME:-vyjebanaskola}'
            retries: 3
            timeout: 5s

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
