# Distinct project name so this can never collide with the Sail dev stack.
name: vyjebanaskola-prod

# Production stack. Pulls the app image published to GHCR by
# .github/workflows/docker.yml - nothing is built on the server.
#
# Deploy: put this file next to a production .env (see .env.production.example),
# then:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Pin a release with APP_IMAGE, e.g.
#   APP_IMAGE=ghcr.io/tadeasditte/vyjebanaskola:1.2.0

x-app: &app
  image: '${APP_IMAGE:-ghcr.io/tadeasditte/vyjebanaskola:latest}'
  restart: unless-stopped
  # Unlike dev, the image ships no .env - configuration comes in as real
  # environment variables. APP_KEY being set is also what tells the
  # entrypoint to skip its dev scaffolding.
  env_file: .env
  volumes:
    # Persist uploads/logs/sessions across image updates.
    - storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy

services:
  # PHP-FPM - serves the application to nginx.
  app:
    <<: *app
    environment:
      RUN_MIGRATIONS: 'true'
      # The entrypoint syncs the baked public/ (built Vite assets included)
      # into this shared volume so nginx can serve the static files.
      PUBLIC_EXPORT_DIR: /srv/public
    volumes:
      - storage:/var/www/html/storage
      - public:/srv/public

  # nginx - public HTTP entrypoint.
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${APP_PORT:-80}:80'
    volumes:
      - public:/var/www/html/public:ro
      # public/storage is a symlink into storage/app/public; nginx needs the
      # target to resolve it.
      - storage:/var/www/html/storage:ro
    configs:
      - source: nginx-conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # Queue worker (QUEUE_CONNECTION=database)
  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=1

  # Scheduler (runs due tasks every minute)
  scheduler:
    <<: *app
    command: php artisan schedule:work

  # PostgreSQL - not exposed to the host.
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: '${DB_DATABASE:-vyjebanaskola}'
      POSTGRES_USER: '${DB_USERNAME:-vyjebanaskola}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:?set DB_PASSWORD in .env}'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USERNAME:-vyjebanaskola} -d ${DB_DATABASE:-vyjebanaskola}
      interval: 5s
      timeout: 5s
      retries: 10

configs:
  nginx-conf:
    content: |
      server {
          listen 80;
          server_name _;
          root /var/www/html/public;
          index index.php;

          charset utf-8;
          client_max_body_size 64M;

          location / {
              try_files $$uri $$uri/ /index.php?$$query_string;
          }

          location = /favicon.ico { access_log off; log_not_found off; }
          location = /robots.txt  { access_log off; log_not_found off; }

          error_page 404 /index.php;

          location ~ \.php$$ {
              fastcgi_pass app:9000;
              fastcgi_index index.php;
              fastcgi_param SCRIPT_FILENAME $$realpath_root$$fastcgi_script_name;
              fastcgi_param PATH_INFO $$fastcgi_path_info;
              include fastcgi_params;
              fastcgi_hide_header X-Powered-By;
              fastcgi_read_timeout 120s;
          }

          location ~ /\.(?!well-known).* {
              deny all;
          }
      }

volumes:
  db-data:
  storage:
  public:
